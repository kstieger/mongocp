name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: darwin
            goarch: amd64
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip
          - goos: windows
            goarch: arm64
            ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          BIN_NAME=mongocp
          if [ "${GOOS}" = "windows" ]; then
            BIN_NAME=mongocp.exe
          fi
          go build -trimpath -ldflags "-s -w" -o "dist/${BIN_NAME}" ./cmd/mongocp

      - name: Package artifact
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          PKG_BASE="mongocp_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p package
          if [ "${GOOS}" = "windows" ]; then
            cp dist/mongocp.exe package/
            cp README.md LICENSE package/
            (cd package && zip -q "../dist/${PKG_BASE}.zip" mongocp.exe README.md LICENSE)
            echo "ASSET=dist/${PKG_BASE}.zip" >> "$GITHUB_ENV"
          else
            cp dist/mongocp package/
            cp README.md LICENSE package/
            tar -C package -czf "dist/${PKG_BASE}.tar.gz" mongocp README.md LICENSE
            echo "ASSET=dist/${PKG_BASE}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
